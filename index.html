<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Games</title>
<style>
body{background:#0a0a0f;color:#fff;font-family:Arial;margin:0}
h1{text-align:center;padding:20px;background:linear-gradient(90deg,#7c3aed,#ec4899)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
@media(min-width:600px){#grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#1e1e2e;padding:20px 10px;border-radius:12px;text-align:center;font-weight:bold;border:1px solid #333;cursor:pointer}
.card:hover{background:#7c3aed}
#player{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column}
#player.active{display:flex}
#bar{padding:12px;background:#111;display:flex;justify-content:space-between}
#bar button{background:#7c3aed;color:#fff;border:0;padding:8px 16px;border-radius:20px}
iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<h1>🎮 100 MIND-BLOWING GAMES - TAP TO PLAY</h1>
<div id="grid"></div>
<div id="player"><div id="bar"><span id="gName"></span><button onclick="document.getElementById('player').classList.remove('active');document.getElementById('frame').src=''">CLOSE X</button></div><iframe id="frame" allowfullscreen></iframe></div>
<script>

games.forEach((name,i)=>{
let d=document.createElement('div');d.className='card';d.innerHTML=(i+1)+'. '+name;
d.onclick=()=>{document.getElementById('gName').innerText=name;document.getElementById('frame').src=urls[i];document.getElementById('player').classList.add('active');};

});
</script>
</body>
</html>
